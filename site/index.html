<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0c100d">
<title>Termoak · the SSH client whose sessions never drop</title>
<!-- Tags with data-seo are replaced on every page by js/seo.js (and by the
     prerendered HTML, see scripts/prerender.mjs), from seo.json. -->
<meta name="description" content="Free, open-source SSH client for Windows, macOS, Linux, iOS and Android, with server sessions that never drop, session sharing, background AI and an encrypted vault." data-seo>
<link rel="icon" href="/assets/icon.svg?v={{VERSION}}" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<script src="/assets/js/theme-boot.js?v={{VERSION}}"></script>
<link rel="stylesheet" href="/assets/css/base.css?v={{VERSION}}">
<link rel="stylesheet" href="/assets/css/components.css?v={{VERSION}}">
<link rel="stylesheet" href="/assets/css/layout.css?v={{VERSION}}">
<link rel="stylesheet" href="/assets/css/pages.css?v={{VERSION}}">
<script type="module" src="/assets/app.js?v={{VERSION}}"></script>
</head>
<body>
<div id="app">
  <div class="boot" role="status">
    <img class="boot-logo" src="/assets/icon.svg?v={{VERSION}}" alt="" width="56" height="56">
    <span class="visually-hidden">Loading Termoak…</span>
  </div>
</div>
<div id="toasts" class="toasts" role="status" aria-live="polite" aria-relevant="additions"></div>
<noscript><p class="noscript">Termoak needs JavaScript to work. · Termoak necesita JavaScript para funcionar.</p></noscript>
</body>
</html>
